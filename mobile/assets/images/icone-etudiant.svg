<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f7a"/>
      <stop offset="1" stop-color="#063a5c"/>
    </linearGradient>
    <clipPath id="clipLogo"><circle cx="884" cy="884" r="104"/></clipPath>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#021a2b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1024" height="1024" rx="0" fill="url(#fond)"/>
  <circle cx="160" cy="140" r="220" fill="#137c8b" opacity="0.25"/>
  <circle cx="980" cy="560" r="180" fill="#137c8b" opacity="0.18"/>

  <!-- Étudiant : corps -->
  <path d="M130 1024 C130 820 250 735 400 735 C550 735 670 820 670 1024 Z" fill="#cfe3ef"/>
  <!-- Col -->
  <path d="M345 742 L400 800 L455 742 Z" fill="#a9cadd"/>

  <!-- Tête ronde anonyme -->
  <circle cx="400" cy="610" r="118" fill="#ffffff"/>

  <!-- Bras qui réfléchit (main sous le menton) -->
  <path d="M600 930 C620 840 560 760 500 715" fill="none" stroke="#b9d5e6" stroke-width="74" stroke-linecap="round"/>
  <circle cx="478" cy="700" r="46" fill="#eef6fb" stroke="#9fc3d8" stroke-width="6"/>
  <path d="M452 682 Q470 676 488 682 M452 700 Q470 694 490 700" fill="none" stroke="#9fc3d8" stroke-width="5" stroke-linecap="round"/>

  <!-- Toque de diplômé -->
  <path d="M300 520 Q400 470 500 520 L500 560 Q400 520 300 560 Z" fill="#0A2D4F"/>
  <polygon points="235,505 400,440 565,505 400,570" fill="#0A2D4F"/>
  <polygon points="235,505 400,440 565,505 400,570" fill="none" stroke="#1d5f8a" stroke-width="4"/>
  <circle cx="400" cy="505" r="9" fill="#e2a019"/>
  <path d="M400 505 L540 535 L540 610" fill="none" stroke="#e2a019" stroke-width="7" stroke-linecap="round"/>
  <rect x="530" y="604" width="20" height="34" rx="6" fill="#e2a019"/>

  <!-- Bulles de pensée -->
  <circle cx="612" cy="502" r="12" fill="#ffffff"/>
  <circle cx="566" cy="458" r="22" fill="#ffffff"/>

  <!-- Nuage -->
  <g fill="#ffffff" filter="url(#ombre)">
    <ellipse cx="715" cy="270" rx="245" ry="140"/>
    <circle cx="560" cy="230" r="85"/>
    <circle cx="660" cy="150" r="95"/>
    <circle cx="790" cy="145" r="95"/>
    <circle cx="890" cy="225" r="85"/>
    <circle cx="880" cy="340" r="80"/>
    <circle cx="740" cy="385" r="85"/>
    <circle cx="590" cy="350" r="80"/>
  </g>

  <!-- Icônes dans le nuage -->
  <!-- 1. Dev : </> -->
  <g transform="translate(625 200)">
    <rect x="-70" y="-50" width="140" height="100" rx="20" fill="#e4f0f9"/>
    <path d="M-28 -24 L-52 0 L-28 24" fill="none" stroke="#063a5c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 -24 L52 0 L28 24" fill="none" stroke="#063a5c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 -30 L-10 30" fill="none" stroke="#137c8b" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 2. Math : π, √, + -->
  <g transform="translate(810 200)">
    <rect x="-70" y="-50" width="140" height="100" rx="20" fill="#e6f3ee"/>
    <text x="-30" y="22" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-style="italic" font-weight="700" fill="#2d8066">&#960;</text>
    <path d="M8 2 L18 -4 L30 26 L44 -32 L62 -32" fill="none" stroke="#2d8066" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3. Langues : bulle de dialogue "Aa" -->
  <g transform="translate(625 335)">
    <path d="M-62 -44 H62 Q72 -44 72 -34 V22 Q72 32 62 32 H-10 L-36 54 L-32 32 H-62 Q-72 32 -72 22 V-34 Q-72 -44 -62 -44 Z" fill="#f6e9ee"/>
    <text x="0" y="12" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="50" font-weight="800" fill="#8e3b54">Aa</text>
  </g>

  <!-- 4. PC : écran + support -->
  <g transform="translate(810 335)">
    <rect x="-70" y="-50" width="140" height="100" rx="20" fill="#fdf3dd"/>
    <rect x="-46" y="-34" width="92" height="56" rx="8" fill="#e2a019"/>
    <rect x="-38" y="-26" width="76" height="40" rx="4" fill="#ffffff"/>
    <path d="M-28 -12 H8 M-28 0 H20" stroke="#e2a019" stroke-width="5" stroke-linecap="round"/>
    <rect x="-8" y="22" width="16" height="12" fill="#e2a019"/>
    <rect x="-30" y="32" width="60" height="8" rx="4" fill="#e2a019"/>
  </g>

  <!-- Mini logo IMTECH INFO -->
  <circle cx="884" cy="884" r="116" fill="#ffffff" filter="url(#ombre)"/>
  <image x="772" y="772" width="224" height="224" clip-path="url(#clipLogo)" xlink:href="data:image/png;base64,"/>
  <circle cx="884" cy="884" r="112" fill="none" stroke="#e2a019" stroke-width="6"/>
</svg>
